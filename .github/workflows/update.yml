name: 북토크 캘린더 배포

# 일정 수집은 Claude Code 루틴이 collector/RUNBOOK.md 절차로 매일 오전·저녁 main에 push한다.
# 여기서는 그 결과를 GitHub Pages로 배포만 한다 (API 키 불필요).
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/update.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # 업로드 직후 아티팩트가 아직 조회되지 않아 "Found 0 artifact(s)"로 실패하는 경우가 있어,
      # 한 번 실패하면 잠시 기다렸다가 다시 배포한다.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
