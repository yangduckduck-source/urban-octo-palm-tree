queries = [
  "서울 북토크 {month}",
  "작가와의 만남 서울 서점 {month}",
  "교보문고 보라토크 {month}",
  "교보문고 명강의 Big10 {month}",
  "예스24 작가 북토크 {month}",
  "알라딘 작가와의 만남 {month}",
