# 북토크 캘린더 수집기 설정
# 수집기는 매일 아래 '미션'을 하나씩 웹에서 검색하고, 찾은 행사를 site/data/events.json 에 합칩니다.
# 미션을 추가·삭제하면 다음 실행부터 바로 반영됩니다.

[general]
model = "claude-opus-5-5"
# 오늘부터 며칠 뒤까지의 행사를 찾을지
horizon_days = 60
# 지난 행사를 달력에 며칠 동안 남겨둘지
keep_past_days = 45
# 미션 하나당 최대 웹 검색 / 페이지 열람 횟수 (비용과 직결)
max_searches_per_mission = 6
max_fetches_per_mission = 4
research_effort = "medium"
extract_effort = "low"

[profile]
# 추천 점수를 매길 때 Claude에게 전달하는 관심사 설명
description = """
문예창작을 연구하는 성인 독자. 글쓰기(창작·작법·에세이 쓰기), 한국문학과 세계문학(소설·시·에세이·비평),
철학, 인문학 강연과 북토크에 관심이 많다. 작가가 자신의 창작 과정을 이야기하는 자리,
평론가·편집자와 함께 작품을 깊게 읽는 자리, 철학자의 강의를 특히 선호한다.
무료·유료는 상관없다. 어린이·청소년 대상 행사, 자기계발·재테크·육아 강연은 관심 없다.
"""

# ── 검색 미션 ────────────────────────────────────────────────
# city: 서울 / 청주 / 둘 다
# queries: 검색 아이디어 ({month}=이번 달, {nextmonth}=다음 달, {year}=올해)
#   행사는 '○○ 작가, 독자와 만난다', '강연 연다', '오는 24일' 같은 기사 문장으로 잘 잡힙니다.
# urls: 직접 열어볼 일정 페이지 (있으면 정확도가 올라갑니다)

[[missions]]
name = "서울 서점 북토크"
